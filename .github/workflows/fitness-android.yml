name: Build Fitness Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/fitness/**'
      - '.github/workflows/fitness-android.yml'
permissions:
  contents: write
concurrency:
  group: fitness-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile APK
        run: gradle -p android/fitness --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Darshan-Fitness-Android-APK
          path: android/fitness/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK to website source
        run: |
          mkdir -p fitness/downloads
          cp android/fitness/app/build/outputs/apk/debug/app-debug.apk fitness/downloads/darshan-fitness.apk
          printf '{"version":"1.0","build":"%s","type":"Android test build"}\n' "$GITHUB_SHA" > fitness/downloads/android-version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fitness/downloads/darshan-fitness.apk fitness/downloads/android-version.json
          git commit -m 'Publish Darshan Fitness Android test APK'
          git pull --rebase origin main
          git push origin HEAD:main
