<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1739"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/site.css"><title>Project Brief Builder | Dimple Enterprises</title><meta name="description" content="Build and download a clear website or digital project brief."></head><body><main class="page-shell"><article class="page-card"><a class="home-link" href="index.html">← Back to homepage</a><span class="eyebrow">Free planning tool</span><h1>Build your project brief.</h1><p>Organise the information needed for a useful first discussion. Your entries remain in this page until you download the text file.</p><form id="brief-builder"><label>Business name<input name="business"></label><label>Contact name or email<input name="contact"></label><label class="full">Project type<select name="project_type"><option>New business website</option><option>Website redesign</option><option>E-commerce / catalogue</option><option>Marketing / SEO</option><option>Automation</option></select></label><fieldset class="full builder-options"><legend>Primary goals</legend><label><input type="checkbox" name="goals" value="Generate enquiries"> Generate enquiries</label><label><input type="checkbox" name="goals" value="Build credibility"> Build credibility</label><label><input type="checkbox" name="goals" value="Sell products"> Sell products</label><label><input type="checkbox" name="goals" value="Improve local visibility"> Improve local visibility</label></fieldset><fieldset class="full builder-options"><legend>Requested features</legend><label><input type="checkbox" name="features" value="Contact forms"> Contact forms</label><label><input type="checkbox" name="features" value="WhatsApp integration"> WhatsApp integration</label><label><input type="checkbox" name="features" value="Product catalogue"> Product catalogue</label><label><input type="checkbox" name="features" value="Multi-language"> Multi-language</label><label><input type="checkbox" name="features" value="Analytics"> Analytics</label><label><input type="checkbox" name="features" value="Automation"> Automation</label></fieldset><label>Timeline<select name="timeline"><option>Within 1 month</option><option>Within 2–3 months</option><option>Within 3–6 months</option><option>Still planning</option></select></label><label>Budget<select name="budget"><option>Below ₹20,000</option><option>₹20,000–₹50,000</option><option>₹50,000–₹1,00,000</option><option>Above ₹1,00,000</option></select></label><label class="full">Other notes<textarea name="notes" rows="5"></textarea></label></form><h2>Preview</h2><pre id="brief-preview" class="generated-preview"></pre><button class="btn primary" id="brief-download" type="button">Download project brief</button></article></main><script src="js/site.js" defer></script></body></html>
